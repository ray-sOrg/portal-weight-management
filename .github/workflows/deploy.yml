name: Build & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_NAME: portal-weight-management
  K8S_DEPLOYMENT_FILE: deployment.yaml
  ROLLOUT_TIMEOUT: 180
  HEALTH_CHECK_HOST: weight.tt829.cn
  HEALTH_CHECK_PATH: /

jobs:
  deploy:
    name: Build & Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_NAME="localhost/${{ env.PROJECT_NAME }}"
          IMAGE_TAG="build-${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD)"
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE_NAME:$IMAGE_TAG"

      - name: Build Docker image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/deployment-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=min
          platforms: linux/amd64

      - name: Compress and checksum image
        id: archive
        run: |
          gzip -1 "$RUNNER_TEMP/deployment-image.tar"
          sha256sum "$RUNNER_TEMP/deployment-image.tar.gz" > "$RUNNER_TEMP/deployment-image.tar.gz.sha256"
          echo "size=$(du -h "$RUNNER_TEMP/deployment-image.tar.gz" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare deployment manifest
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"
          sed -i "s|__IMAGE_NAME__|$IMAGE|g" "${{ env.K8S_DEPLOYMENT_FILE }}"
          sed -i "s|__IMAGE_TAG__|$TAG|g" "${{ env.K8S_DEPLOYMENT_FILE }}"
          echo "Deploying: $IMAGE:$TAG"

      - name: Upload image and manifest
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH_COMMAND="ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=4"
          for attempt in 1 2 3; do
            if rsync \
              --archive \
              --partial \
              --inplace \
              --timeout=120 \
              -e "$SSH_COMMAND" \
              "$RUNNER_TEMP/deployment-image.tar.gz" \
              "${{ env.K8S_DEPLOYMENT_FILE }}" \
              "${DEPLOY_USER}@${DEPLOY_HOST}:"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Image upload failed after three attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          LOCAL_SHA="$(cut -d' ' -f1 "$RUNNER_TEMP/deployment-image.tar.gz.sha256")"
          REMOTE_SHA="$(ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'sha256sum "$HOME/deployment-image.tar.gz"' | cut -d' ' -f1)"
          test "$LOCAL_SHA" = "$REMOTE_SHA"

      - name: Import image into k3s
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'sudo -n /usr/local/sbin/k3s-import-deployment-image'

      - name: Apply deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'export KUBECONFIG="$HOME/.kube/config"; kubectl apply -f "$HOME/deployment.yaml"; status=$?; rm -f "$HOME/deployment.yaml"; exit $status'

      - name: Verify deployment and service route
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          DEPLOYMENT="${{ env.PROJECT_NAME }}-deployment"
          if ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "export KUBECONFIG=\"\$HOME/.kube/config\"; kubectl rollout status deployment/$DEPLOYMENT --timeout=${{ env.ROLLOUT_TIMEOUT }}s && curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 15 -H 'Host: ${{ env.HEALTH_CHECK_HOST }}' 'http://127.0.0.1${{ env.HEALTH_CHECK_PATH }}' >/dev/null"; then
            echo "Deployment and route check succeeded"
          else
            echo "Deployment check failed; rolling back"
            ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "export KUBECONFIG=\"\$HOME/.kube/config\"; kubectl rollout undo deployment/$DEPLOYMENT && kubectl rollout status deployment/$DEPLOYMENT --timeout=${{ env.ROLLOUT_TIMEOUT }}s"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployment: ${{ job.status }}"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- Archive: \`${{ steps.archive.outputs.size }}\`"
            echo "- Host: \`${{ env.HEALTH_CHECK_HOST }}\`"
            echo "- Registry: bypassed (SSH direct upload)"
          } >> "$GITHUB_STEP_SUMMARY"
